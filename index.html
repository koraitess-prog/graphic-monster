<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#202426"><meta name="description" content="Your design decisions create a creature. Name your monster, explore five visual decisions, and watch it take shape.">
<title>GRAPHIC MONSTER — Your design decisions create a creature</title><link rel="stylesheet" href="./style.css"><link rel="stylesheet" href="./night.css?v=arrival1">
<link rel="stylesheet" href="./interface-type.css?v=arrival1">
</head>
<body>
<div id="paper-cover" class="paper-cover" role="region" aria-label="Move the paper scraps aside to enter"><canvas aria-hidden="true"></canvas><button class="paper-skip" type="button">Enter</button></div>
<header class="site-header"><a href="./" class="wordmark" aria-label="Graphic Monster home">GRAPHIC MONSTER</a><div class="header-actions"><button class="text-button" data-action="archive" disabled>Archive</button><button id="header-name" class="header-name" data-action="rename" hidden aria-label="Edit your monster’s name"></button></div></header>
<main id="app" class="experience screen-intro"><aside id="studio" class="studio" aria-label="Your evolving creature"><div class="canvas-wrap"><canvas id="monster" role="img" aria-label="An illustrated creature with gouache and pencil textures"></canvas></div><div class="studio-foot"><span id="stage-note"></span><span id="creature-caption" dir="auto"></span></div></aside><section id="copy" class="copy"><h1 class="intro-title">GRAPHIC<br>MONSTER</h1><form class="name-form"><label class="sr-only" for="loading-name">Name</label><input id="loading-name" placeholder="Name" disabled></form></section></main>
<section id="afterlife" class="afterlife" hidden aria-label="Your creature’s story"><div id="full-story" class="full-story"></div></section>
<main id="collection-screen" class="collection-screen" hidden></main>

<dialog id="name-dialog" aria-labelledby="name-dialog-title"><form id="rename-form"><h2 id="name-dialog-title">Name</h2><label class="sr-only" for="edit-monster-name">Name</label><input id="edit-monster-name" name="monsterName" required maxlength="48" autocomplete="off" dir="auto"><div class="dialog-actions"><button type="submit" class="primary">Save</button><button type="button" class="text-button" data-action="close-name">Cancel</button></div></form></dialog>
<p id="announcement" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></p>
<noscript><style>.paper-cover{display:none}</style><p class="noscript">Enable JavaScript to create your monster.</p></noscript>
<script type="module" src="./src/paper-intro.js"></script>
<script type="module" src="./src/boot.js?v=arrival1"></script>
</body></html>
