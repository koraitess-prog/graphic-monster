<title>GRAPHIC MONSTER — Your design decisions create a creature</title><link rel="stylesheet" href="./style.css"><link rel="stylesheet" href="./night.css?v=paperfall2">

<body class="intro-paper">
<header class="site-header"><a href="./" class="wordmark" aria-label="Graphic Monster home">GRAPHIC MONSTER</a><div class="header-actions"><button class="text-button" data-action="archive" disabled>Archive</button><button id="header-name" class="header-name" data-action="rename" hidden aria-label="Edit your monster’s name"></button></div></header>
<main id="app" class="experience screen-intro"><aside id="studio" class="studio" aria-label="Living material observation field"><span id="material-step" class="lab-meta"></span><div class="canvas-wrap"><canvas id="monster" role="img" aria-label="An illustrated creature with gouache and pencil textures"></canvas></div><div class="studio-foot"><span id="stage-note"></span><span id="creature-caption" dir="auto"></span></div></aside><section id="copy" class="copy"><h1 class="intro-title paper-title illustrated-title" aria-label="GRAPHIC MONSTER"><img src="./assets/intro-title.webp" width="1920" height="600" fetchpriority="high" alt=""></h1><form class="name-form"><label class="sr-only" for="loading-name">Name</label><input id="loading-name" placeholder="Name" disabled><button type="submit" class="lab-entry" disabled>Begin</button></form></section><div id="material-record" class="material-record" role="group" aria-label="Retained material" hidden></div></main>
<section id="afterlife" class="afterlife" hidden aria-label="Your creature’s story"><div id="full-story" class="full-story"></div></section>
<main id="collection-screen" class="collection-screen" hidden></main>

<dialog id="name-dialog" aria-labelledby="name-dialog-title"><form id="rename-form"><h2 id="name-dialog-title">Name</h2><label class="sr-only" for="edit-monster-name">Name</label><input id="edit-monster-name" name="monsterName" required maxlength="48" autocomplete="off" dir="auto"><div class="dialog-actions"><button type="submit" class="primary">Save</button><button type="button" class="text-button" data-action="close-name">Cancel</button></div></form></dialog>
<p id="announcement" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></p>
<noscript><style>.paper-cover{display:none}</style><p class="noscript">Enable JavaScript to create your monster.</p></noscript>
