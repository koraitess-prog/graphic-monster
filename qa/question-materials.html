<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Material choices — GRAPHIC MONSTER</title>
<style>body{margin:0;background:#202426;color:#e8ddba;font:12px monospace;padding:30px}main{max-width:1100px;margin:auto}h1{font:14px monospace;margin:0 0 26px}section{border-top:1px solid #48524b;padding:18px 0}h2{font:11px monospace;color:#a5b1a2;margin:0 0 8px}.objects{display:flex;gap:16px;overflow:auto}figure{margin:0;flex:1;min-width:120px;max-width:220px}canvas{width:100%;height:auto;display:block}figcaption{font-size:10px;text-align:center;color:#bfc5b6;padding:8px}</style><main><h1>GRAPHIC MONSTER / MATERIAL STUDIES</h1><div id="studies"></div></main><script type="module">
import {QUESTIONS} from '../src/dna.js';import {paintQuestionPaper} from '../src/question-papers.js';
for(const q of QUESTIONS){const section=document.createElement('section'),title=document.createElement('h2'),row=document.createElement('div');title.textContent=q.key;row.className='objects';for(const [value,label]of q.options){const figure=document.createElement('figure'),canvas=document.createElement('canvas'),caption=document.createElement('figcaption');caption.textContent=label;figure.append(canvas,caption);row.append(figure);paintQuestionPaper(canvas,value);}section.append(title,row);document.querySelector('#studies').append(section);}
</script></html>
