<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Paper vortex / GRAPHIC MONSTER</title><link rel="stylesheet" href="../interface-type.css"><style>*{box-sizing:border-box}body{margin:0;background:#202426;color:#e8ddba;font:12px monospace}main{max-width:980px;margin:auto;padding:22px}header{display:flex;justify-content:space-between;align-items:center;gap:20px}h1{font-size:12px;font-weight:400}a,button{color:inherit;font:inherit}a{text-underline-offset:5px}canvas{display:block;width:min(100%,600px);height:min(65svh,620px);object-fit:contain;margin:10px auto}nav{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}button{min-height:44px;padding:10px 15px;background:transparent;border:1px solid #687564;cursor:pointer}button:focus-visible{outline:2px solid #e8ddba;outline-offset:4px}p{text-align:center;font-size:10px;color:#b5c0b0}</style></head><body><main><header><h1>GRAPHIC MONSTER / PAPER VORTEX</h1><a href="../">App</a></header><canvas id="vortex" role="img" aria-label="Printed scraps, eyes and limbs carried through several paper currents"></canvas><nav><button data-action="gentle">Gentle drop</button><button data-action="throw">Throw paper</button><button data-action="form">Form creature</button><button data-action="restart">Replay vortex</button></nav><p id="state" role="status">Local motion study · no archive writes</p></main><script type="module">
import {generateMonster} from '../src/dna.js';import {CreatureView} from '../src/renderer.js';import {PaperFormation} from '../src/paper-formation.js';
const canvas=document.querySelector('canvas'),state=document.querySelector('#state'),answers={principle:'color',organization:'experiment',gaze:'expression',density:'rich',attitude:'playful'},scene=generateMonster({...answers,seed:13},6),view=new CreatureView(canvas,scene),formation=new PaperFormation(view);let forming=false;
canvas.dataset.paperWorkbench='true';formation.update(scene,answers);
const observer=new IntersectionObserver(entries=>formation.setVisible(entries[0].isIntersecting));observer.observe(canvas);
document.querySelector('nav').addEventListener('click',async e=>{const action=e.target.dataset.action;if(!action||forming)return;if(action==='restart'){view.stop();formation.answerKey=null;formation.update(scene,answers);state.textContent='Paper vortex';}else if(action==='form'){forming=true;state.textContent='Paper finds its anatomy';try{await formation.reveal(scene);state.textContent='Creature formed';}finally{forming=false;}}else{formation.stir({energy:action==='throw'?1:.18,spin:action==='throw'?-1:1});state.textContent=action==='throw'?'Fast throw':'Gentle drop';}});
</script></body></html>
