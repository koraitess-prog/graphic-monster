<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Answers build anatomy / GRAPHIC MONSTER</title><link rel="stylesheet" href="../interface-type.css"><style>*{box-sizing:border-box}body{margin:0;background:#202426;color:#e8ddba;font:12px monospace}main{max-width:1250px;margin:auto;padding:28px}header{display:flex;align-items:center;justify-content:space-between;gap:20px}h1{font-size:14px;font-weight:400}p{color:#bac5b5;font-size:12px;line-height:1.7}a{color:inherit;text-underline-offset:5px}.studies{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:26px 20px}figure{margin:0;border-top:1px solid #58624f}canvas{width:100%;height:auto;display:block}figcaption{font-size:12px;line-height:1.8;padding:10px 0}small{display:block;color:#b7c2ae;font-size:12px}@media(max-width:700px){.studies{grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 14px}main{padding:18px}header{align-items:start}}</style></head><body><main><header><h1>ANSWERS BUILD ANATOMY</h1><a href="../">Create a monster</a></header><p>One answer changes at a time. The last two creatures share answers and have different random seeds.</p><div class="studies"></div></main><script type="module">
import {generateMonster} from '../src/dna.js';import {MonsterRenderer} from '../src/renderer.js';
const base={principle:'grid',organization:'order',gaze:'clarity',density:'minimal',attitude:'precise'},cases=[['Reference',{},11],['Material → typography',{principle:'typography'},11],['Organization → experiment',{organization:'experiment'},11],['Gaze → expression',{gaze:'expression'},11],['Density → rich',{density:'rich'},11],['Gesture → playful',{attitude:'playful'},11],['Same answers / seed 1',{},1],['Same answers / seed 999',{},999]];
for(const[label,change,seed]of cases){const scene=generateMonster({...base,...change,seed},7),figure=document.createElement('figure'),canvas=document.createElement('canvas'),caption=document.createElement('figcaption');new MonsterRenderer(canvas,{scale:1,background:'#202426'}).draw(scene);caption.textContent=label;const meta=document.createElement('small');meta.textContent=scene.anatomy+' · '+scene.eyes.length+' eyes';caption.append(meta);figure.append(canvas,caption);document.querySelector('.studies').append(figure);}
</script></body></html>
