<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Creature play / GRAPHIC MONSTER</title><link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="../night.css"><link rel="stylesheet" href="../interface-type.css"><link rel="stylesheet" href="../laboratory.css"><style>.review-nav{display:flex;align-items:center;gap:16px}.review-nav select{font:inherit;font-size:12px;background:#202426;color:#e8ddba;border:1px solid #65735e;min-height:44px;padding:8px}.review-nav button{font:inherit;font-size:12px;color:#e8ddba;background:none;border:0;min-height:44px}a.specimen-new{text-decoration:none}</style></head><body class="monster-reveal"><header class="site-header"><span class="wordmark">GRAPHIC MONSTER / PLAY STUDY</span><div class="review-nav"><select aria-label="Monster family" id="family"></select><button id="replay">Replay</button></div></header><main class="experience screen-reveal"><aside class="studio"><div class="canvas-wrap"><canvas id="monster" role="img" aria-label="A paper monster exploring the frame"></canvas></div></aside><section class="copy"><div class="observation-identity"><h1 class="reveal-name" id="name">Rift</h1><p class="specimen-description">A living paper specimen. It explores the frame, grips the edge and comes close enough to watch you watching it.</p><div class="specimen-actions"><a class="specimen-new" href="../">Create new monster</a><button class="text-button specimen-play-toggle" aria-pressed="false">Pause play</button></div></div></section></main><script type="module">
import {mountCreatureName} from '../src/creature-lettering.js';import {describeCreature} from '../src/creature-description.js';import {generateMonster} from '../src/dna.js';import {ANATOMIES} from '../src/paper-dna.js';import {CreatureView} from '../src/renderer.js';import {mountObservation} from '../src/observation.js';
const select=document.querySelector('select');for(const family of ANATOMIES){const o=document.createElement('option');o.value=family;o.textContent=family;select.append(o);}select.value='accordion';let view,binding;
function show(){binding?.destroy();view?.destroy();const scene=generateMonster({anatomy:select.value,principle:'color',organization:'experiment',gaze:'expression',density:'rich',attitude:'playful',seed:411},6);document.querySelector('#name').textContent=select.value;mountCreatureName(document.querySelector('#name'),{scene});document.querySelector('.specimen-description').textContent=describeCreature(scene);view=new CreatureView(document.querySelector('canvas'),scene);binding=mountObservation(document.querySelector('.studio'),view,{play:true,meet:true,pause:document.querySelector('.specimen-play-toggle')});document.querySelector('.specimen-play-toggle').textContent='Pause play';document.querySelector('.specimen-play-toggle').setAttribute('aria-pressed','false');}
select.addEventListener('change',show);document.querySelector('#replay').addEventListener('click',show);show();
</script></body></html>
