<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Paper DNA — GRAPHIC MONSTER</title><link rel="stylesheet" href="../../style.css"><link rel="stylesheet" href="../../night.css"><style>
main{max-width:1500px;margin:auto;padding:28px 36px}header,nav,.tools{display:flex;align-items:center;justify-content:space-between;gap:20px}header{border-bottom:1px solid var(--line);padding-bottom:20px}a{color:var(--ink);text-decoration:none;font:12px Georgia}.tools{margin-top:24px;justify-content:flex-start;flex-wrap:wrap}select,button{color:var(--ink);background:transparent;border:1px solid var(--line);padding:10px 14px;font:13px Georgia;border-radius:0}button{cursor:pointer}button:hover,button[aria-pressed=true]{border-color:var(--accent);color:var(--accent)}button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:4px}.stage{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:center;gap:40px}.stage canvas{min-width:0;width:100%;max-height:65svh;object-fit:contain}.copy{max-width:400px}h1{font:400 clamp(32px,4vw,62px) Georgia;margin:0 0 28px}.languages{display:flex;flex-wrap:wrap;gap:8px}.dna{color:var(--muted);font:11px monospace;margin-top:22px}.comparisons{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px}.comparisons figure{margin:0}.comparisons canvas{width:100%;height:auto;display:block}.comparisons figcaption{font:13px Georgia;border-top:1px solid var(--line);padding:15px 0}.comparison-title{font:12px Georgia;color:var(--muted);border-top:1px solid var(--line);padding-top:26px;margin:12px 0}.toggle{border:0;padding:0;display:flex;gap:6px}label{font:12px Georgia;color:var(--muted)}@media(max-width:700px){main{padding:20px}.stage{grid-template-columns:1fr;gap:8px}.stage canvas{height:48svh}.copy{max-width:none}h1{font-size:32px;margin-bottom:18px}.comparisons{grid-template-columns:repeat(2,minmax(0,1fr))}.tools{gap:12px}nav{gap:12px}}
