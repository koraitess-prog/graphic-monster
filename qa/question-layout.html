<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Question layout review</title><link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="../night.css"><link rel="stylesheet" href="../interface-type.css"><link rel="stylesheet" href="../questionnaire.css"><link rel="stylesheet" href="../laboratory.css"><body class="question-paper"><header class="site-header"><a href="question-materials.html" class="wordmark">GRAPHIC MONSTER / REVIEW</a></header><main class="experience screen-question"><aside class="studio"><div class="canvas-wrap"></div></aside><section class="copy"><div id="choices" class="choices five" role="group" aria-label="Paper objects"></div></section></main><script type="module">
import {QUESTIONS} from '../src/dna.js';import {mountQuestionPapers} from '../src/question-papers.js';
const q=QUESTIONS[Number(new URLSearchParams(location.search).get('step'))||0],row=document.querySelector('#choices');row.className='choices '+(q.options.length===5?'five':'two');for(const[value,label]of q.options){const b=document.createElement('button');b.className='choice';b.setAttribute('aria-label',label);b.innerHTML='<span class="choice-art"><canvas data-paper-choice="'+value+'"></canvas></span>';row.append(b);}mountQuestionPapers(row);
</script></body></html>
