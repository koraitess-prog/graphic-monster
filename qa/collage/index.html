<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GRAPHIC MONSTER / Cut paper</title><link rel="stylesheet" href="../../style.css"><link rel="stylesheet" href="../../night.css"><style>
main{max-width:1920px;margin:auto;padding:28px 40px 48px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:23px}header a{color:var(--ink);font:13px Georgia;text-decoration:none}.studies{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:22px;margin-top:48px}.study{min-width:0}.study canvas{width:100%;height:auto;aspect-ratio:600/760;display:block;object-fit:contain}h1{font:400 13px Georgia;letter-spacing:.09em;margin:0}figcaption{display:flex;justify-content:space-between;font:16px Georgia;padding-top:20px;border-top:1px solid var(--line)}small{color:var(--muted);font:10px monospace}figure{margin:0}.rift-review-link{font:12px Georgia,serif;color:var(--accent);display:inline-block;padding:16px 0;text-decoration:none}.study-principle{display:block;font:11px Georgia,serif;color:var(--muted);margin-top:9px}@media(min-width:681px) and (max-width:1100px){.studies{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:680px){main{padding:22px}.studies{grid-template-columns:1fr}.study canvas{height:70svh}header a{font-size:11px}}
</style><main><header><h1>GRAPHIC MONSTER</h1><nav style="display:flex;gap:24px"><a href="../../">Enter ↗</a></nav></header><section class="studies" aria-label="Cut paper creatures"></section></main><script type="module">
import {generateMonster,QUESTIONS} from '../../src/dna.js';import {CreatureView} from '../../src/renderer.js?v=mobile2';
const studies=[['Rift','typography','experiment','clarity','precise'],['Scuttle','grid','order','expression','precise'],['Sallow','color','experiment','expression','precise'],['Crook','shape','experiment','clarity','playful'],['Bristle','texture','order','expression','playful'],['Pleat','color','order','expression','precise'],['Stilt','shape','order','clarity','precise'],['Tangle','texture','experiment','clarity','playful']];
const root=document.querySelector('.studies');
for(const [i,[name,principle,organization,gaze,attitude]]of studies.entries()){
 const scene=generateMonster({principle,organization,gaze,density:'rich',attitude},5),figure=document.createElement('figure');figure.className='study';figure.innerHTML=`<canvas role="img" aria-label="${name}, cut-paper creature"></canvas><figcaption><span>${name}<span class="study-principle">${QUESTIONS[0].options.find(o=>o[0]===principle)[1]}</span></span><small>0${i+1} / ${scene.code}</small></figcaption>${principle==='typography'?'<a class="rift-review-link" href="../character-review/rift.html">Eyes & motion ↗</a>':''}`;root.append(figure);new CreatureView(figure.querySelector('canvas'),scene);
}
</script></html>
