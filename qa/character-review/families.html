<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GRAPHIC MONSTER — Family motion</title><link rel="stylesheet" href="../../style.css"><link rel="stylesheet" href="../../night.css"><link rel="stylesheet" href="../../interface-type.css"><style>
main{max-width:1440px;margin:auto;padding:24px 30px}header{display:flex;align-items:center;justify-content:space-between;gap:25px;border-bottom:1px solid var(--line);padding-bottom:20px}header a{color:var(--ink);text-decoration:none;font-size:12px}h1{font:400 38px Georgia,serif;margin:24px 0 18px;letter-spacing:-1px}.controls{display:flex;flex-wrap:wrap;gap:8px}.controls button{background:none;color:var(--ink);border:1px solid var(--line);padding:9px 16px;min-height:44px}.controls button:hover,.controls button[aria-pressed=true]{border-color:var(--accent);color:var(--accent)}.controls button:disabled{opacity:.3}#families{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-top:22px}.family{background:none;border:1px solid transparent;min-width:0;padding:8px;color:var(--ink);text-align:left}.family:hover{border-color:var(--line)}.family[aria-pressed=true]{border-color:var(--accent)}.family canvas{display:block;width:100%;height:280px;object-fit:contain}.family-label{display:flex;justify-content:space-between;align-items:center;gap:5px;font-size:12px;text-transform:capitalize}.family-label small{font-size:11px;color:var(--muted);white-space:nowrap}#status{font-size:12px;color:var(--muted);margin:14px 0;min-height:22px}@media(max-width:850px){#families{grid-template-columns:repeat(2,minmax(0,1fr))}.family canvas{height:250px}.family-label{display:block}.family-label small{display:block}main{padding:18px}.controls button{padding:8px 12px}}
</style></head><body><main><header><a href="../../">GRAPHIC MONSTER</a><span>8 families / 80 variations</span></header><h1>Family motion</h1><nav class="controls" aria-label="Selected family action"><button data-action="breathe">Breathe</button><button data-action="walk">Walk</button><button data-action="run">Run</button><button data-action="jump">Jump</button><button data-action="greet">Greet</button><button data-action="look">Look</button><button data-action="stretch">Stretch</button></nav><section id="families" aria-label="Compare base families"></section><p id="status" role="status" aria-live="polite">Select a creature, then an action.</p></main><script type="module" src="../../src/family-review.js"></script></body></html>
