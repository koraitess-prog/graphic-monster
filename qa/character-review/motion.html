<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rift — Motion study</title><link rel="stylesheet" href="../../style.css"><link rel="stylesheet" href="../../night.css"><link rel="stylesheet" href="../../interface-type.css"><style>
main{max-width:1120px;margin:auto;padding:24px 32px}header{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:16px}header a{color:var(--ink);text-decoration:none;font-size:12px}h1{font:400 42px Georgia,serif;letter-spacing:-2px;margin:22px 0 10px}.motion-stage{display:grid;grid-template-columns:1fr 175px;gap:30px;align-items:center}canvas{display:block;width:100%;height:calc(100svh - 190px);object-fit:contain}.actions{display:grid;gap:10px}.actions button{min-height:44px;background:none;border:1px solid var(--line);color:var(--ink);padding:10px 15px;text-align:left}.actions button:hover,.actions button[aria-pressed=true]{border-color:var(--accent);color:var(--accent)}.actions button:disabled{opacity:.4}#motion-pause{border:0;color:var(--muted);margin-top:14px}#motion-status{color:var(--muted);font-size:12px;min-height:22px;margin:12px 0}.note{font-size:11px;color:var(--muted)}@media(max-width:680px){main{padding:18px}h1{font-size:34px}.motion-stage{grid-template-columns:1fr;gap:8px}canvas{height:58svh}.actions{grid-template-columns:repeat(4,1fr);gap:6px}.actions button{font-size:11px;padding:8px 5px;text-align:center}#motion-pause{margin:0;grid-column:1/-1}header{font-size:11px}}
</style></head><body><main><header><a href="../../">GRAPHIC MONSTER</a><span class="note">Motion study / 01</span></header><h1>Rift</h1><div class="motion-stage"><canvas id="action-creature" role="img" aria-label="Rift, an original paper-cut creature demonstrating breathing, walking, jumping and greeting"></canvas><nav class="actions" aria-label="Character actions"><button data-action="breathe" aria-pressed="true">Breathe</button><button data-action="walk" aria-pressed="false">Walk</button><button data-action="jump" aria-pressed="false">Jump</button><button data-action="greet" aria-pressed="false">Greet</button><button id="motion-pause">Pause</button></nav></div><p id="motion-status" role="status" aria-live="polite">Breathing</p></main><script type="module" src="../../src/action-review.js"></script></body></html>
