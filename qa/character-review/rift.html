<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#202426"><title>Rift — Character review</title><link rel="stylesheet" href="../../style.css"><link rel="stylesheet" href="../../night.css"><style>
main{max-width:1380px;margin:auto;padding:26px 40px 65px}.review-header{display:flex;align-items:center;justify-content:space-between;gap:20px;border-bottom:1px solid var(--line);padding-bottom:18px}.review-header a{font:12px Georgia,serif;color:var(--muted);text-decoration:none}.review-top{display:flex;justify-content:space-between;align-items:baseline;gap:24px;margin:28px 0 8px}.review-top h1{font:900 54px Georgia,serif;letter-spacing:-.05em;margin:0}.review-controls{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.review-controls button{border:1px solid var(--line);background:none;min-height:42px;padding:0 20px;color:var(--ink);font:13px Georgia,serif}.review-controls button:hover{border-color:var(--accent);color:var(--accent)}.review-controls button:disabled{opacity:.4}.review-controls label{font:12px Georgia,serif;color:var(--muted);display:flex;align-items:center;gap:8px;padding:10px}.review-controls input{accent-color:var(--accent);width:15px;height:15px}.rift-variants{display:grid;grid-template-columns:1fr 1fr;gap:42px}.rift-variants figure{min-width:0;margin:0}.rift-variants canvas{display:block;width:100%;height:min(70svh,800px);object-fit:contain}.rift-variants figcaption{border-top:1px solid var(--line);padding-top:17px;display:flex;justify-content:space-between;font:19px Georgia,serif}.rift-variants small{font:11px Georgia,serif;color:var(--muted);padding-top:5px}@media(max-width:680px){main{padding:20px}.review-top{display:block;margin-top:24px}.review-top h1{font-size:44px}.review-controls{margin-top:18px;gap:8px}.review-controls button{padding-inline:16px}.rift-variants{grid-template-columns:1fr;gap:32px}.rift-variants canvas{height:65svh}.rift-variants figcaption{font-size:17px}}
